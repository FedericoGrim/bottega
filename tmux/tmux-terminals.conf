set -g prefix C-a
unbind C-b
bind C-a send-prefix
set -g mouse on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -sg escape-time 10
set -g base-index 1
set -g renumber-windows on
set -g history-limit 10000
setw -g mode-keys vi

setw -g automatic-rename on
setw -g automatic-rename-format "#{pane_current_command}"

set -g status-position top
set -g status-style "bg=#1a1b26,fg=#565f89"
set -g status-left "#[fg=#7aa2f7,bold] 󰆍 TERMINALI "
set -g status-left-length 20
set -g status-right "#[fg=#565f89]Alt+n nuovo  Alt+←/→ cambia "
set -g status-right-length 40
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[bg=#292e42,fg=#c0caf5,bold] #I #W "

bind -n M-n new-window -c "#{pane_current_path}"
bind -n M-Left previous-window
bind -n M-Right next-window
bind -n M-r command-prompt -I "#W" "rename-window '%%'"
bind -n M-x confirm-before -p "chiudere #W? (y/n)" kill-window
