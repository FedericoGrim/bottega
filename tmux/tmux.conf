# --- Base ---
set -g mouse on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -sg escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
setw -g mode-keys vi

# --- Tasti ---
bind r source-file ~/.tmux.conf \; display "config ricaricata"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Aspetto (palette Tokyo Night) ---
set -g status-position top
set -g status-interval 30
set -g status-style "bg=#16161e,fg=#c0caf5"
set -g status-left-length 40
set -g status-left "#[bg=#7aa2f7,fg=#16161e,bold]  #S #[bg=#16161e] "
set -g status-right "#[fg=#9ece6a]󰁹 #(cat /sys/class/power_supply/BAT*/capacity)%%  #[fg=#565f89]%H:%M "
setw -g window-status-format "#[fg=#565f89] #I #W "
setw -g window-status-current-format "#[fg=#7aa2f7,bold] #I #W "
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"
set -g pane-border-status top
set -g pane-border-format " #{pane_current_command} "
set -g message-style "bg=#292e42,fg=#c0caf5"
set -g mode-style "bg=#292e42,fg=#c0caf5"
bind D display-popup -E -w 92% -h 92% -T " container " "podman-tui"
