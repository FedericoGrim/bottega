name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y tmux jq fzf shellcheck

      - name: Pre-commit hooks
        run: pipx run pre-commit run --all-files

      - name: Scan the pull request for secrets
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git --log-opts="origin/${{ github.base_ref }}..HEAD" --redact --verbose

      - name: Check commit messages
        run: |
          pipx install conventional-pre-commit
          for commit in $(git rev-list --no-merges "origin/${{ github.base_ref }}..HEAD"); do
            git log -1 --format=%B "$commit" > "$RUNNER_TEMP/message"
            conventional-pre-commit feat fix docs style refactor perf test build ci chore revert "$RUNNER_TEMP/message"
          done

      - name: Python tests
        run: python3 -m unittest discover -s tests

      - name: Shell tests
        run: |
          for suite in tests/test_*.sh; do
            bash "$suite"
          done
